<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ameath</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  #pet-canvas {
    display: block;
    image-rendering: pixelated;
  }
  #context-menu {
    display: none;
    position: fixed;
    z-index: 9999;
    background: rgba(255, 241, 246, 0.96);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid #F3C2D4;
    border-radius: 8px;
    padding: 4px 0;
    min-width: 150px;
    box-shadow: 0 4px 20px rgba(74, 42, 58, 0.15);
    font-family: -apple-system, "Helvetica Neue", sans-serif;
    font-size: 13px;
    color: #4A2A3A;
  }
  #context-menu .menu-item {
    padding: 6px 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #context-menu .menu-item:hover {
    background: #FFE1EE;
  }
  #context-menu .menu-item.disabled {
    color: #7A5564;
    cursor: default;
  }
  #context-menu .menu-separator {
    height: 1px;
    background: #F3C2D4;
    margin: 3px 8px;
  }
  #context-menu .check-mark {
    display: inline-block;
    width: 14px;
    text-align: center;
  }
</style>
</head>
<body>
  <canvas id="pet-canvas"></canvas>
  <div id="context-menu"></div>
  <script src="gif-parser.js"></script>
  <script src="music-player.js"></script>
  <script src="ameath.js"></script>
</body>
</html>
